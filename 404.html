<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دعوة زفاف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
 
  /* ============================================================
     عشان تغيّر البيانات، غيّر القيم هنا بس (بين علامات ")
     ============================================================ */
  :root{
    --groom-name: "باشمهندس محمد";
    --bride-name: "الأستاذة هدى";
    --wedding-day-name: "الجمعة";
    --wedding-date: "25/9";
    --wedding-time: "الساعة 3:30";
    --venue-name: "من عند مزلقان دنشواي";
    --venue-city: "";
    --maps-link: "https://www.google.com/maps/search/?api=1&query=%D9%85%D8%B2%D9%84%D9%82%D8%A7%D9%86%20%D8%AF%D9%86%D8%B4%D9%88%D8%A7%D9%8A";
  }
 
  * { box-sizing: border-box; margin:0; padding:0; }
 
  :root{
    --ink: #2b241d;
    --ink-soft: #5b5044;
    --parchment: #faf3e6;
    --parchment-2: #f3e9d7;
    --gold: #b8892f;
    --gold-deep: #8c661f;
    --emerald: #1f3d32;
    --emerald-deep: #14261f;
  }
 
  html,body{
    background: var(--emerald-deep);
    font-family: 'Tajawal', sans-serif;
    color: var(--ink);
    min-height: 100vh;
  }
 
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 16px;
    background:
      radial-gradient(circle at 50% 0%, #24473a 0%, var(--emerald-deep) 65%);
  }
 
  .card{
    position:relative;
    width: 100%;
    max-width: 480px;
    background: var(--parchment);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.45);
    border: 1px solid rgba(184,137,47,0.35);
  }
 
  .frame{
    position:absolute;
    inset: 10px;
    border: 1px solid var(--gold);
    border-radius: 3px;
    pointer-events:none;
    opacity:0.55;
  }
  .frame::before, .frame::after,
  .frame-inner::before, .frame-inner::after{
    content:'';
    position:absolute;
    width: 34px; height: 34px;
    border: 1px solid var(--gold);
  }
  .frame::before{ top:-1px; right:-1px; border-left:none; border-bottom:none; }
  .frame::after{ bottom:-1px; left:-1px; border-right:none; border-top:none; }
  .frame-inner{ position:absolute; inset:10px; pointer-events:none; }
  .frame-inner::before{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
  .frame-inner::after{ bottom:-1px; right:-1px; border-left:none; border-top:none; }
 
  .content{
    position:relative;
    padding: 52px 34px 40px;
    text-align:center;
  }
 
  .eyebrow-orn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    color: var(--gold-deep);
    margin-bottom: 18px;
  }
  .eyebrow-orn svg{ width:22px; height:22px; }
  .eyebrow-orn .line{
    height:1px; width:36px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
 
  .bismillah{
    font-family:'Aref Ruqaa', serif;
    font-size: 1.05rem;
    color: var(--ink-soft);
    margin-bottom: 22px;
  }
 
  .invite-line{
    font-size: 0.95rem;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
 
  .names{
    font-family:'Aref Ruqaa', serif;
    font-weight:700;
    font-size: 2.6rem;
    line-height:1.5;
    color: var(--emerald);
    margin: 14px 0 4px;
  }
 
  .amp{
    display:block;
    font-family:'Aref Ruqaa', serif;
    color: var(--gold-deep);
    font-size: 1.4rem;
    margin: 2px 0;
  }
 
  .divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 14px;
    margin: 26px 0;
  }
  .divider .diamond{
    width:8px; height:8px;
    background: var(--gold);
    transform: rotate(45deg);
  }
  .divider .rule{
    height:1px;
    width: 70px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
 
  .details{
    display:flex;
    flex-direction:column;
    gap: 18px;
    margin-bottom: 28px;
  }
 
  .detail-row{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
 
  .detail-label{
    font-size: 0.72rem;
    color: var(--gold-deep);
    letter-spacing: 0.5px;
  }
 
  .detail-value{
    font-size: 1.15rem;
    color: var(--ink);
    font-weight:500;
  }
  .detail-sub{
    font-size: 0.85rem;
    color: var(--ink-soft);
  }
 
  .map-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-top:6px;
    padding: 9px 18px;
    border: 1px solid var(--gold-deep);
    border-radius: 999px;
    color: var(--emerald);
    text-decoration:none;
    font-size: 0.85rem;
    align-self:center;
    transition: background .2s ease, color .2s ease;
  }
  .map-btn:hover{ background: var(--emerald); color: var(--parchment); border-color: var(--emerald); }
  .map-btn svg{ width:15px; height:15px; }
 
  .music-player{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 12px;
    margin-top: 6px;
  }
 
  .play-btn{
    width: 46px; height:46px;
    border-radius:50%;
    background: var(--emerald);
    color: var(--parchment);
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition: transform .15s ease;
  }
  .play-btn:active{ transform: scale(0.92); }
  .play-btn svg{ width:18px; height:18px; }
 
  .music-label{
    font-size: 0.8rem;
    color: var(--ink-soft);
    text-align:right;
  }
 
  #yt-hidden-player{
    position:absolute;
    width:1px; height:1px;
    overflow:hidden;
    opacity:0.01;
    pointer-events:none;
  }
 
  .footer-note{
    margin-top: 30px;
    font-size: 0.8rem;
    color: var(--ink-soft);
    font-style:italic;
  }
 
  @media (max-width: 380px){
    .names{ font-size: 2.1rem; }
    .content{ padding: 44px 22px 32px; }
  }
 
  @media (prefers-reduced-motion: reduce){
    .play-btn{ transition:none; }
  }
</style>
</head>
<body>
 
  <div class="card">
    <div class="frame"></div>
    <div class="frame-inner"></div>
 
    <div class="content">
 
      <div class="eyebrow-orn">
        <span class="line"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M12 2 L14 10 L22 12 L14 14 L12 22 L10 14 L2 12 L10 10 Z"/></svg>
        <span class="line"></span>
      </div>
 
      <div class="bismillah">بسم الله الرحمن الرحيم</div>
      <div class="invite-line">يتشرف</div>
      <div class="invite-line">بدعوتكم لحضور حفل زفاف</div>
 
      <div class="names">
        <var class="groom-name-slot"></var>
        <span class="amp">و</span>
        <var class="bride-name-slot"></var>
      </div>
 
      <div class="divider">
        <span class="rule"></span>
        <span class="diamond"></span>
        <span class="rule"></span>
      </div>
 
      <div class="details">
 
        <div class="detail-row">
          <span class="detail-label">التاريخ</span>
          <span class="detail-value date-slot"></span>
          <span class="detail-sub time-slot"></span>
        </div>
 
        <div class="detail-row">
          <span class="detail-label">المكان</span>
          <span class="detail-value venue-slot"></span>
          <span class="detail-sub city-slot"></span>
          <a class="map-btn" target="_blank" rel="noopener" href="#" id="mapsLink">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.3"/></svg>
            افتح الموقع على الخريطة
          </a>
        </div>
 
      </div>
 
      <div class="divider">
        <span class="rule"></span>
        <span class="diamond"></span>
        <span class="rule"></span>
      </div>
 
      <div class="music-player">
        <button class="play-btn" id="playBtn" aria-label="تشغيل الأغنية">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <span class="music-label">اضغط للاستماع<br>لأغنية المناسبة</span>
      </div>
      <!-- مشغل يوتيوب مخفي بصريًا، بيشغل الصوت بس -->
      <div id="yt-hidden-player"><div id="yt-player"></div></div>
 
      <div class="footer-note">بإذن الله ورضاه</div>
 
    </div>
  </div>
 
<script>
  // ============ البيانات بتتقرأ من فوق تلقائي ============
  const style = getComputedStyle(document.documentElement);
  const clean = v => v.trim().replace(/^"(.*)"$/, '$1');
 
  document.querySelectorAll('.groom-name-slot').forEach(el => el.textContent = clean(style.getPropertyValue('--groom-name')));
  document.querySelectorAll('.bride-name-slot').forEach(el => el.textContent = clean(style.getPropertyValue('--bride-name')));
 
  const dayName = clean(style.getPropertyValue('--wedding-day-name'));
  const dateVal = clean(style.getPropertyValue('--wedding-date'));
  document.querySelectorAll('.date-slot').forEach(el => el.textContent = `${dayName} ${dateVal}`);
  document.querySelectorAll('.time-slot').forEach(el => el.textContent = clean(style.getPropertyValue('--wedding-time')));
 
  document.querySelectorAll('.venue-slot').forEach(el => el.textContent = clean(style.getPropertyValue('--venue-name')));
  document.querySelectorAll('.city-slot').forEach(el => el.textContent = clean(style.getPropertyValue('--venue-city')));
 
  document.getElementById('mapsLink').href = clean(style.getPropertyValue('--maps-link'));
  document.querySelectorAll('.city-slot').forEach(el => { if (!el.textContent.trim()) el.style.display = 'none'; });
 
  document.title = `دعوة زفاف ${clean(style.getPropertyValue('--groom-name'))} و ${clean(style.getPropertyValue('--bride-name'))}`;
 
  // ============ أغنية المناسبة (يوتيوب) ============
  // عشان تغيّر الأغنية: غيّر YT_VIDEO_ID و YT_START_SECONDS بس
  const YT_VIDEO_ID = 'Z7YR5Tx3v-8';
  const YT_START_SECONDS = 43;
 
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const pauseSVG = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
  const playSVG = '<path d="M8 5v14l11-7z"/>';
 
  let ytPlayer = null;
  let ytReady = false;
  let pendingPlay = false;
 
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.body.appendChild(tag);
 
  window.onYouTubeIframeAPIReady = function () {
    ytPlayer = new YT.Player('yt-player', {
      height: '1',
      width: '1',
      videoId: YT_VIDEO_ID,
      playerVars: { start: YT_START_SECONDS, controls: 0, disablekb: 1, rel: 0 },
      events: {
        onReady: () => {
          ytReady = true;
          if (pendingPlay) { ytPlayer.playVideo(); pendingPlay = false; }
        },
        onStateChange: (e) => {
          if (e.data === YT.PlayerState.PLAYING) playIcon.innerHTML = pauseSVG;
          else if (e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED) playIcon.innerHTML = playSVG;
        }
      }
    });
  };
 
  playBtn.addEventListener('click', () => {
    if (!ytReady) { pendingPlay = true; return; }
    const state = ytPlayer.getPlayerState();
    if (state === YT.PlayerState.PLAYING) {
      ytPlayer.pauseVideo();
    } else {
      ytPlayer.playVideo();
    }
  });
</script>
 
</body>
</html>
