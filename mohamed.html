<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دعوة  باشمهندس محمد و الأستاذة هدى</title>

<!-- ===== صورة ولينك الشير (واتساب / تليجرام / فيسبوك) ===== -->
<meta property="og:type" content="website">
<meta property="og:title" content="دعوة  باشمهندس محمد و الأستاذة هدى">
<meta property="og:description" content="يتشرفوا بدعوتكم — الجمعة 25/9 الساعة 3:30">
<meta property="og:image" content="mo.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://mohammednasse98.github.io/invitation/mohamed/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://mohammednasse98.github.io/invitation/mohamed/preview.jpg">
<meta name="theme-color" content="#14261f">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#2b241d; --ink-soft:#5b5044;
    --parchment:#faf3e6;
    --gold:#b8892f; --gold-deep:#8c661f; --gold-light:#e6c878;
    --emerald:#1f3d32; --emerald-deep:#14261f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;font-family:'Tajawal',sans-serif;color:var(--ink);background:var(--emerald-deep)}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 16px;
    background:radial-gradient(circle at 50% 0%,#2a5343 0%,var(--emerald-deep) 68%);
  }

  /* ---------- شاشة الافتتاح ---------- */
  #intro{
    position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
    background:radial-gradient(circle at 50% 30%,#2a5343 0%,var(--emerald-deep) 70%);
    transition:opacity .9s ease, visibility .9s ease;
  }
  #intro.gone{opacity:0;visibility:hidden}
  .seal{
    width:132px;height:132px;border-radius:50%;border:none;cursor:pointer;
    font-family:'Aref Ruqaa',serif;font-weight:700;font-size:1.25rem;line-height:1.35;color:var(--emerald-deep);
    background:radial-gradient(circle at 35% 30%,#f3d98f,#c29431 60%,#8c661f);
    box-shadow:0 0 0 6px rgba(184,137,47,.25),0 0 0 14px rgba(184,137,47,.12),0 18px 40px rgba(0,0,0,.5);
    animation:pulse 2.4s ease-in-out infinite;
  }
  .seal:focus-visible{outline:3px solid var(--parchment);outline-offset:6px}
  @keyframes pulse{50%{transform:scale(1.05)}}
  .intro-t{font-family:'Aref Ruqaa',serif;color:var(--gold-light);font-size:1.5rem}
  .intro-s{color:rgba(250,243,230,.6);font-size:.85rem}

  /* ---------- الكارت ---------- */
  .card{
    position:relative;width:100%;max-width:480px;background:var(--parchment);border-radius:6px;overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.5);border:1px solid rgba(184,137,47,.35);
    opacity:0;transform:translateY(14px);transition:opacity 1.1s ease .3s, transform 1.1s ease .3s;
  }
  body.open .card{opacity:1;transform:none}

  .frame{position:absolute;inset:10px;border:1px solid var(--gold);border-radius:3px;pointer-events:none;opacity:.55}
  .frame2{position:absolute;inset:16px;border:1px solid rgba(184,137,47,.3);pointer-events:none}
  .content{position:relative;padding:54px 32px 38px;text-align:center}

  .star{color:var(--gold-deep);margin-bottom:16px}
  .star svg{width:24px;height:24px}

  .bismillah{font-family:'Aref Ruqaa',serif;font-size:1.15rem;color:var(--ink-soft);margin-bottom:20px}
  .invite-line{font-size:.98rem;color:var(--ink-soft);margin-bottom:4px}

  .names{
    font-family:'Aref Ruqaa',serif;font-weight:700;font-size:2.7rem;line-height:1.5;margin:16px 0 6px;
    background:linear-gradient(180deg,#d9b04e 0%,#a67a25 55%,#7a5518 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .amp{display:block;font-size:1.5rem;line-height:1.2;color:var(--gold-deep);-webkit-text-fill-color:var(--gold-deep)}

  .divider{display:flex;align-items:center;justify-content:center;gap:14px;margin:24px 0}
  .divider .rule{height:1px;width:70px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  .divider .diamond{width:8px;height:8px;background:var(--gold);transform:rotate(45deg)}

  .details{display:flex;flex-direction:column;gap:20px}
  .label{font-size:.78rem;color:var(--gold-deep);margin-bottom:3px}
  .value{font-size:1.25rem;font-weight:500}
  .sub{font-size:.9rem;color:var(--ink-soft);margin-top:2px}


  /* العد التنازلي */
  .count-title{font-size:.85rem;color:var(--ink-soft);margin-bottom:10px}
  .countdown{display:flex;justify-content:center;direction:ltr}
  .unit{min-width:66px;padding:2px 6px}
  .unit + .unit{border-left:1px solid rgba(184,137,47,.45)}
  .unit b{display:block;font-family:'Aref Ruqaa',serif;font-size:2rem;line-height:1.2;color:var(--emerald);font-variant-numeric:tabular-nums}
  .unit span{font-size:.75rem;color:var(--ink-soft)}
  .count-done{font-family:'Aref Ruqaa',serif;font-size:1.4rem;color:var(--gold-deep)}

  .footer-note{margin-top:26px;font-family:'Aref Ruqaa',serif;font-size:1.05rem;color:var(--ink-soft)}

  /* زرار الصوت */
  #sound{
    position:fixed;bottom:18px;left:18px;z-index:5;width:44px;height:44px;border-radius:50%;border:1px solid var(--gold);
    background:rgba(20,38,31,.85);color:var(--gold-light);cursor:pointer;display:none;align-items:center;justify-content:center;
  }
  body.open #sound{display:flex}
  #sound svg{width:20px;height:20px}
  #sound:focus-visible{outline:3px solid var(--gold-light);outline-offset:3px}
  #sound .off{display:none}
  #sound.muted .on{display:none}
  #sound.muted .off{display:block}

  @media (max-width:380px){.names{font-size:2.2rem}.content{padding:46px 20px 32px}.unit{min-width:58px}}
  @media (prefers-reduced-motion:reduce){.card,#intro{transition:none}.seal{animation:none}}
</style>
</head>
<body>

<!-- ============================================================
     عشان تغيّر البيانات، غيّر القيم دي بس (بين علامات ")
     ============================================================ -->
<script>
  const CONFIG = {
    groom:     "باشمهندس محمد",
    bride:     "الأستاذة هدى",
    dayName:   "الجمعة",
    dateText:  "25/9",
    timeText:  "الساعة 3:30",
    venue:     "من عند مزلقان دنشوا ي",
    city:      "",
    // ميعاد الفرح للعد التنازلي (بتوقيت مصر): سنة-شهر-يوم T ساعة:دقيقة
    countdownTo: "2026-09-25T15:30:00+03:00",
    // الأغنية: حط الملف جنب index.html بنفس الاسم ده
    songFile:  "muisec.mpeg",
    songStart: 0,      // تبدأ من الثانية كام
    songEnd:   0       // لو عاوز تقطعها عند ثانية معينة وتعيد (0 = تشتغل للآخر وتعيد)
  };
</script>

<!-- شاشة الافتتاح: اللمسة دي هي اللي بتخلي الأغنية تشتغل على كل الموبايلات -->
<div id="intro">
  <div class="intro-t">دعوة خطوبة</div>
  <button class="seal" id="openBtn" type="button">افتح<br>الدعوة</button>
  <div class="intro-s">اضغط للفتح</div>
</div>

<main class="card">
  <div class="frame"></div><div class="frame2"></div>
  <div class="content">

    <div class="star"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M12 2 L14 10 L22 12 L14 14 L12 22 L10 14 L2 12 L10 10 Z"/></svg></div>

    <div class="bismillah">بسم الله الرحمن الرحيم</div>
    <div class="invite-line">يتشرف</div>
    <div class="invite-line">بدعوتكم لحضور حفل خطوبة</div>

    <h1 class="names">
      <span id="groom"></span>
      <span class="amp">و</span>
      <span id="bride"></span>
    </h1>

    <div class="divider"><span class="rule"></span><span class="diamond"></span><span class="rule"></span></div>

    <div class="details">
      <div>
        <div class="label">التاريخ</div>
        <div class="value" id="date"></div>
        <div class="sub" id="time"></div>
      </div>
      <div>
        <div class="label">المكان</div>
        <div class="value" id="venue"></div>
        <div class="sub" id="city"></div>
      </div>
    </div>

    <div class="divider"><span class="rule"></span><span class="diamond"></span><span class="rule"></span></div>

    <div id="countWrap">
      <div class="count-title">فاضل على الفرح</div>
      <div class="countdown" id="countdown" aria-live="off">
        <div class="unit"><b id="cs">00</b><span>ثانية</span></div>
        <div class="unit"><b id="cm">00</b><span>دقيقة</span></div>
        <div class="unit"><b id="ch">00</b><span>ساعة</span></div>
        <div class="unit"><b id="cd">0</b><span>يوم</span></div>
      </div>
    </div>

    <div class="footer-note">بإذن الله ورضاه</div>
  </div>
</main>

<button id="sound" type="button" aria-label="كتم / تشغيل الصوت">
  <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
  <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>
</button>

<audio id="music" src="" preload="auto" playsinline></audio>

<script>
  const $ = id => document.getElementById(id);

  // ===== تعبئة البيانات =====
  $('groom').textContent = CONFIG.groom;
  $('bride').textContent = CONFIG.bride;
  $('date').textContent  = `${CONFIG.dayName} ${CONFIG.dateText}`;
  $('time').textContent  = CONFIG.timeText;
  $('venue').textContent = CONFIG.venue;
  if (CONFIG.city.trim()) $('city').textContent = CONFIG.city; else $('city').style.display = 'none';

  // ===== العد التنازلي =====
  const target = new Date(CONFIG.countdownTo).getTime();
  const pad = n => String(n).padStart(2, '0');
  function tick(){
    let s = Math.floor((target - Date.now()) / 1000);
    if (s <= 0){
      $('countWrap').innerHTML = '<div class="count-done">الفرح النهارده — نورونا</div>';
      clearInterval(timer); return;
    }
    $('cd').textContent = Math.floor(s / 86400);
    $('ch').textContent = pad(Math.floor(s % 86400 / 3600));
    $('cm').textContent = pad(Math.floor(s % 3600 / 60));
    $('cs').textContent = pad(s % 60);
  }
  const timer = setInterval(tick, 1000); tick();

  // ===== الأغنية (ملف على نفس الموقع) =====
  const audio = $('music');
  audio.src = CONFIG.songFile;
  audio.loop = !CONFIG.songEnd;

  audio.addEventListener('loadedmetadata', () => { if (CONFIG.songStart) audio.currentTime = CONFIG.songStart; });
  audio.addEventListener('timeupdate', () => {
    if (CONFIG.songEnd && audio.currentTime >= CONFIG.songEnd) audio.currentTime = CONFIG.songStart;
  });

  $('openBtn').addEventListener('click', () => {
    document.body.classList.add('open');
    $('intro').classList.add('gone');
    audio.play().catch(() => {});   // بيشتغل لأنه جاي من ضغطة المستخدم
  });

  $('sound').addEventListener('click', e => {
    audio.muted = !audio.muted;
    e.currentTarget.classList.toggle('muted', audio.muted);
  });

  // لو الشاشة اتقفلت أو المستخدم خرج من التبويب، وقّف الصوت وكمّل لما يرجع
  document.addEventListener('visibilitychange', () => {
    if (!document.body.classList.contains('open')) return;
    document.hidden ? audio.pause() : audio.play().catch(() => {});
  });
</script>
</body>
</html>
